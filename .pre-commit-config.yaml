# Optional: `pip install pre-commit && pre-commit install` runs these checks on every commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npm --prefix web exec -- prettier --write --ignore-unknown
        language: system
        files: ^web/src/
        exclude: ^web/src/generated/
      - id: eslint
        name: eslint
        entry: npm --prefix web run lint
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false
