[project]
name = "localcode"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "PyYAML==6.0.2", "markdown-it-py==4.2.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.8.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["localcode*"]

[tool.setuptools.package-data]
localcode = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
