version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      web-dev:
        dependency-type: development
  - package-ecosystem: docker
    directory: /runner
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
