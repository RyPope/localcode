name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e 'backend[dev]'
      - run: ruff check backend runner
      - run: ruff format --check backend runner
      - run: pytest -q backend
      - name: OpenAPI document is up to date
        run: python -m localcode.tools.openapi web/openapi.json && git diff --exit-code web/openapi.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Generated API types are up to date
        run: npm run api-types && git diff --exit-code src/generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --target test -t localcode-runner-test runner
      - run: docker run --rm --init --sysctl kernel.shmmax=16777216 --sysctl kernel.shmall=4096 localcode-runner-test

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose build app

  # Every repo-kept problem parses and its solutions pass its tests in the real sandbox.
  content:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose up -d --build
      - name: Wait for the runner
        run: |
          for _ in $(seq 60); do
            docker compose exec -T -u localcode app python -c "from localcode.judging import runner_client as r; raise SystemExit(0 if r.versions() else 1)" && exit 0
            sleep 2
          done
          docker compose logs; exit 1
      - run: make validate-content
