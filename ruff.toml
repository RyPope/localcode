line-length = 120
target-version = "py314"
extend-exclude = ["web", "**/.venv"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # unicode punctuation in user-facing strings is intentional
]

[lint.isort]
known-first-party = ["localcode"]

[lint.per-file-ignores]
"**/tests/**" = ["E501"]
